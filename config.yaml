# Parental Gateway configuration.
# Machine-specific overrides go in config.local.yaml next to this file (same
# layout, deep-merged on top). deploy/setup-pi.sh writes one for the Pi.

# monitor = DNS filtering + passive traffic monitoring. Runs anywhere (your PC).
# gateway = the Raspberry Pi is the router: full enforcement (Linux, root).
mode: monitor

dns:
  listen_host: 0.0.0.0
  listen_port: 5353              # 53 on the Pi (setup-pi.sh sets this)
  upstreams: ["1.1.1.1", "9.9.9.9"]
  upstream_port: 53
  # Remove HTTPS/SVCB records so browsers never get Encrypted Client Hello
  # keys - this keeps the real site name visible in every TLS handshake.
  strip_https_records: "filtered"        # filtered | all | off
  block_qtypes_filtered: ["NULL", "ANY"] # record types only DNS-tunnel tools use
  redirect_port: 5354            # gateway mode: DNS aimed at other servers lands here (flags "custom DNS")
  tunnel_detection:
    enabled: true
    window: 300            # seconds
    unique_names: 120      # long random subdomains of one domain in the window
    min_label_len: 24
    block_hours: 24

web:
  # The dashboard's name at home: http://family.local (also family.home.arpa).
  # On the Pi it also answers on port 80, so no port number is needed.
  local_name: family
  host: 127.0.0.1          # 0.0.0.0 on the Pi (setup-pi.sh sets this)
  port: 8080

database: guardian.db
retention_days: 30

# ---------------------------------------------------------------- groups
# Every device belongs to one group. New/unknown devices land in default_group,
# so a kid who randomises their MAC address or brings a new device gets the
# strictest policy until you approve it in the dashboard.
groups:
  adults:
    filtered: false
    categories: [ads]
  kids:
    filtered: true
    categories: [ads, adult, gambling, torrent, mirrors, unsafe_search]
  consoles:                   # games need UDP; VPN signatures + IP lists still apply
    filtered: true
    categories: [ads, adult, gambling, torrent, mirrors, unsafe_search]
    unknown_destinations: "alert"   # game servers are often obscure: report, don't hold
    protections:              # overrides of the house-wide `protections:` below
      non_web: games          # online games need UDP
      direct_ip: log          # consoles use hard-coded matchmaking addresses: report, don't block
  quarantine:
    filtered: true
    categories: [ads, adult, gambling, torrent, mirrors, unsafe_search]
default_group: quarantine

# ---------------------------------------------------------------- domain categories
categories:
  ads:
    files: [blocklists/builtin/ads.txt]
    urls: [https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt]
  adult:
    files: [blocklists/builtin/adult.txt]
    urls: [https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt]
  gambling:
    urls: [https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/gambling-only/hosts]
  torrent:                    # torrent sites, trackers, DHT bootstrap nodes, clients
    files: [blocklists/builtin/torrent.txt]
  # The next two aren't blocked by default (no group lists them); the download
  # guard uses them to judge where a download comes from. Add one to a group's
  # categories to block those sites outright.
  mirrors:                    # web archives / page caches that show another site's content
    files: [blocklists/builtin/mirrors.txt]
  unsafe_search:              # search engines whose SafeSearch can't be locked on
    files: [blocklists/builtin/unsafe_search.txt]
  piracy:                     # cracked software / warez / streaming-piracy sites
    urls: [https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/anti.piracy-onlydomains.txt]
  filehost:                   # file lockers and APK download sites
    files: [blocklists/builtin/filehost.txt]
  # The next five are switched by `protections:` (vpn, tor, proxies, encrypted_dns),
  # not listed in groups' categories.
  vpn:                        # VPN providers' websites and app sign-in servers
    files: [blocklists/builtin/vpn.txt]
  tor:                        # Tor Browser downloads, bridge distribution, Snowflake
    files: [blocklists/builtin/tor.txt]
  proxy:                      # web proxies, iCloud Private Relay, public tunnelling services
    files: [blocklists/builtin/bypass.txt]
  doh:                        # encrypted-DNS resolvers
    files: [blocklists/builtin/doh.txt]
  bypass:                     # community list mixing all of the above; used while VPN or proxy
    urls: [https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass-onlydomains.txt]

# ---------------------------------------------------------------- destination IP lists
# Filtered devices can't connect to these at all (gateway mode).
ip_lists:
  vpn:
    files: [blocklists/builtin/vpn-ips.txt]
    sources:
      - {type: mullvad, url: "https://api.mullvad.net/www/relays/all/"}
      - {type: proton,  url: "https://api.protonvpn.ch/vpn/logicals"}
      # Whole address ranges of VPN hosting companies. Catches more VPNs, but
      # those companies also host ordinary websites, so expect some false
      # positives. Uncomment if you accept that trade-off.
      # - {type: cidr, url: "https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt"}
    pin_domains: blocklists/builtin/pin-vpn.txt
  tor:                         # every running Tor relay (refreshed daily; alerts say "Tor")
    sources:
      - {type: tor, url: "https://onionoo.torproject.org/details?type=relay&running=true&fields=or_addresses"}
  doh:
    files: [blocklists/builtin/doh-ips.txt]
    pin_domains: blocklists/builtin/pin-doh.txt
lists_refresh_hours: 24

# ---------------------------------------------------------------- enforcement (gateway mode)
enforcement:
  consistency_grace: 21600     # how long (s) an IP from a DNS answer stays valid for that device
  consistency_exempt: blocklists/builtin/consistency-exempt.txt
  ech_public_names: [cloudflare-ech.com]
  fail_open: false             # false = if the inspector stops, filtered devices lose web access (safer)
  queue_backend: auto          # auto | nft | xt
  inspect_packets: 10          # first N packets of each web connection are inspected
  # Apps known to use their own (non-TLS) protocol on port 443. Only applies when
  # the destination was looked up under one of these domains.
  protocol_exempt_domains: [whatsapp.net, whatsapp.com]

# ---------------------------------------------------------------- protections
# The ways around the filter, each switchable. These are the house-wide settings
# for every filtered group; a group can override any of them under its own
# `protections:` (null = use the house-wide value). Adults get none of them.
# The dashboard (setup wizard, Rules page) edits these for you.
protections:
  vpn: true                    # VPN sites, servers, protocols and learned VPN-app fingerprints
  tor: true                    # Tor website, relays and Tor's own handshake
  proxies: true                # proxy sites, Private Relay, HTTP CONNECT / SOCKS proxies
  encrypted_dns: true          # DoH / DoT resolvers, Firefox's DoH canary
  disguised_tunnels: true      # web ports must carry genuine web traffic
  hidden_names: true           # connections must name their site (no-SNI, ECH, QUIC off, HTTPS records)
  direct_ip: enforce           # only connect to addresses our DNS gave out: enforce | log | off
  dns_tunnels: true            # DNS tunnelling + odd record types
  non_web: block               # block (web only) | games (web + UDP) | allow (everything, still checked)
  torrents: true               # BitTorrent protocol, trackers, DHT, peer fan-out
  behaviour: true              # behaviour detector: tunnel-like traffic patterns
  network_attacks: true        # report port scans / probes of the gateway / hidden routers

# ---------------------------------------------------------------- torrents
torrent:
  fanout_peers: 25             # distinct peers on random ports within `window` = torrent/P2P client
  window: 60

# ---------------------------------------------------------------- VPN / Tor technology (not just lists)
# Lists of VPN servers can't keep up, so these target the technology itself
# (switched on/off by `protections:` above).
reputation:
  # The world's most-visited sites. Heavy traffic to anything that isn't
  # popular, a known service, used by an adult here, or approved is suspect.
  popularity_urls:
    - "https://tranco-list.eu/top-1m.csv.zip"
    - "http://s3-us-west-1.amazonaws.com/umbrella-static/top-1m.csv.zip"
  popular_top: 200000
  familiar_days: 60            # sites an adult's device used in this many days count as "known"
vpn:
  # review: cut + hold for your decision | alert: report only | off
  # (falls back to alert automatically until the popularity list has downloaded)
  unknown_destinations: review
  unknown_min_bytes: 15000000   # ... after this much traffic to one unknown site
  unknown_min_seconds: 600      # ... or this long with at least 3 MB
  learn_fingerprints: true      # a caught tunnel's TLS fingerprint is blocked on every server
escalation:
  # Several different bypass techniques from one device in `window` seconds =
  # a VPN/Tor/proxy tool is running. The device is named and paused.
  window: 600
  min_techniques: 3
  min_confidence: 70
  pause_minutes: 15             # 0 = report only

# ---------------------------------------------------------------- downloads
downloads:
  # off | review_suspicious | review_all (every download from an untrusted site)
  #     | block_suspicious (no review - just stop them)
  # A group can override this with its own `downloads:` setting.
  policy: review_suspicious
  min_bytes: 5000000           # a sustained one-way transfer becomes a "download" after this much
  min_rate: 200000             # ... at this speed (bytes/s)
  suspicious_score: 50         # hold at or above this suspicion score
  risky_extensions: [exe, msi, bat, cmd, com, scr, ps1, vbs, js, jar, apk, xapk, apks, ipa, dmg, pkg,
                     deb, rpm, iso, img, zip, rar, 7z, torrent]
  trusted_services: [apple, microsoft, google, steam, epicgames, xbox, playstation, nintendo, minecraft,
                     roblox, spotify, netflix, youtube]

# ---------------------------------------------------------------- adult content (filtered groups)
adult:
  # strict | standard | off. A group can override with `adult_protection:`.
  #   standard: SafeSearch, family DNS, strong adult terms in names, proxy decoding
  #   strict:   + weaker terms (whole words), + video from unknown sites held for review
  mode: strict
  safesearch: true               # Google / Bing / DuckDuckGo / Yandex locked to their safe versions
  youtube_restricted: strict     # strict | moderate | off
  # A second opinion on every filtered lookup. Cloudflare for Families blocks
  # adult content + malware, including sites no blocklist has yet.
  family_dns: ["1.1.1.3", "1.0.0.3"]
  unknown_video: review          # review | block | alert | off - video from sites that aren't known video services
  video_min_bytes: 2000000
  video_sites: [vimeo.com, vimeocdn.com, dailymotion.com, dmcdn.net, bbc.co.uk, bbci.co.uk, khanacademy.org,
                kastatic.org, ted.com, pbs.org, pbskids.org, nationalgeographic.com, nasa.gov, britannica.com,
                brainpop.com, coursera.org, edx.org, duolingo.com, scratch.mit.edu, code.org, cbeebies.com,
                itv.com, channel4.com, sky.com, crunchyroll.com, hulu.com, max.com, paramountplus.com]

# ---------------------------------------------------------------- countermeasure defences
tamper:
  enabled: true
  # A device using an adult device's hardware address but a different "DHCP
  # fingerprint" is treated as filtered until you click "It's me".
  auto_quarantine_confidence: 80
  # A new MAC that matches a known filtered device keeps that device's group
  # (stops "change MAC to escape the kids group"). Never grants adult access.
  carry_over_identity: true
  # Devices attacking the network itself are paused automatically (0 = off).
  auto_pause_minutes: 30
  auto_pause_confidence: 85
  auto_pause_kinds: [arp_spoof, ip_spoof, rogue_dhcp, rogue_ra, port_scan]
  port_scan_ports: 8           # distinct gateway ports probed in a minute
  hidden_router_min: 5         # connections showing an extra router hop
  offline_alert_minutes: 5     # report gaps in the gateway's heartbeat
  repin_minutes: 10            # how long a spoofed address stays pinned to its real owner

# ---------------------------------------------------------------- VPN-behaviour detector
detector:
  enabled: true
  interval: 30
  min_duration: 300            # a connection must be this long-lived (s) ...
  min_bytes: 10000000          # ... and carry this much data to be scored
  unknown_min_duration: 60     # much sooner when the destination is unknown
  unknown_min_bytes: 2000000
  window: 300
  dns_silence_max_queries: 3   # a device tunnelling its DNS stops asking us
  silence_min_bytes: 5000000
  threshold: 70
  block_hours: 24
  learning_days: 3             # "never seen before" signal only after this
  exempt_services: [youtube, netflix, twitch, disneyplus, primevideo, spotify, steam, xbox,
                    playstation, nintendo, apple, microsoft, google, epicgames]

# ---------------------------------------------------------------- traffic accounting
flows:
  poll_interval: 2              # also the live graph's resolution
  active_minute_bytes: 10000   # a minute counts as "in use" above this much traffic
  sniffer_interface: null      # monitor mode: capture interface (null = scapy default)
  log_trusted_devices: true

# ---------------------------------------------------------------- Raspberry Pi router
gateway:
  wan_interface: eth0          # to your ISP router
  lan_interfaces: [eth1]       # to your Wi-Fi access point / switch
  lan_ip: 192.168.50.1
  lan_subnets: [192.168.50.0/24]
  trusted_interfaces: []       # e.g. [eth1.10] if adults have their own SSID/VLAN
  admin_only_dashboard: true   # dashboard + SSH reachable only from admin_groups devices
  admin_groups: [adults]
  allow_wan_ssh: true          # SSH from the ISP-router side (handy during setup)
  ipv6: false                  # no IPv6 path through the gateway = nothing to bypass via IPv6
  dhcp_leases: /var/lib/misc/dnsmasq.leases
  remove_rules_on_exit: false  # keep blocking even if the service is stopped
