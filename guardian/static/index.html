<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parental Gateway</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login-wrap" hidden>
  <form class="login" id="login-form" autocomplete="on">
    <h1 id="login-title">Parental Gateway</h1>
    <div class="muted" id="login-sub">Sign in to manage your network.</div>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password" required>
    <input type="password" id="login-pw2" placeholder="Repeat password" autocomplete="new-password" hidden>
    <button class="primary" type="submit" id="login-btn">Sign in</button>
    <div class="error" id="login-err"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="dot" id="health-dot"></span>Parental Gateway</div>
      <nav class="tabs" id="tabs">
        <a href="#overview" data-v="overview">Overview</a>
        <a href="#live" data-v="live">Live</a>
        <a href="#health" data-v="health">Health</a>
        <a href="#devices" data-v="devices">Devices</a>
        <a href="#activity" data-v="activity">Activity</a>
        <a href="#alerts" data-v="alerts">Alerts<span class="count" id="alert-count" hidden></span></a>
        <a href="#downloads" data-v="downloads">Reviews<span class="count" id="dl-count" hidden></span></a>
        <a href="#rules" data-v="rules">Rules &amp; schedules</a>
        <a href="#system" data-v="system">System</a>
        <a href="#guide" data-v="guide">Guide</a>
      </nav>
      <div class="top-right">
        <span class="badge" id="mode-badge"></span>
        <button class="small" id="logout">Sign out</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="wizard" class="wz-wrap" hidden></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/wizard.js"></script>
</body>
</html>
